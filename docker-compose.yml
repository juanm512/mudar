services:
  postgres:
    image: postgres:16-alpine
    container_name: mudardb
    environment:
      POSTGRES_USER: mudar
      POSTGRES_PASSWORD: mudar
      POSTGRES_DB: mudar_dev
    ports:
      - "54321:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mudar -d mudar_dev" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

